<aside class="w-60 shrink-0 h-full flex flex-col bg-green-600 text-white">
  <!-- Logo IMMB -->
  <div class="flex items-center gap-3 px-5 pt-6 pb-5">
    <div class="w-10 h-10 rounded-full bg-white p-0.5 shrink-0">
      <img src="logo-immb.png" alt="IMMB" class="w-full h-full rounded-full object-contain">
    </div>
    <div class="leading-tight">
      <p class="font-serif font-semibold text-lg text-white">IMMB</p>
      <p class="text-xs text-green-200">Vendas</p>
    </div>
  </div>

  <!-- Novo Produto -->
  <div class="px-4 pb-5">
    <a
      routerLink="/novo-produto"
      routerLinkActive="ring-2 ring-yellow-200"
      class="flex items-center justify-center gap-2 w-full py-2.5 rounded-lg bg-yellow-500 text-green-700 text-sm font-semibold hover:bg-yellow-400 transition-colors">
      <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Novo Produto
    </a>
  </div>

  <!-- Menu de Navegação -->
  <nav class="flex-1 flex flex-col gap-1 px-3">
    @for (pagina of paginas; track pagina.rota) {
      <a
        [routerLink]="pagina.rota"
        routerLinkActive
        #link="routerLinkActive"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors"
        [ngClass]="link.isActive
          ? 'bg-white/10 text-white font-semibold'
          : 'text-green-200 hover:bg-white/5 hover:text-white'">
        <svg viewBox="0 0 24 24" class="w-[18px] h-[18px] shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          @for (d of pagina.icone; track $index) {
            <path [attr.d]="d" />
          }
        </svg>
        {{ pagina.nome }}
      </a>
    }
  </nav>

  <div class="mx-5 border-t border-white/10"></div>
  <p class="px-5 py-4 font-mono text-[10px] uppercase text-green-300">Sistema de gestão</p>
</aside>

<div class="w-full p-8 bg-white">
  <div class="max-w-2xl mx-auto">
    <!-- Título -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Novo Produto</h1>
      <p class="text-gray-600">Adicione um novo produto ao catálogo</p>
    </div>

    <!-- Formulário -->
    <form (ngSubmit)="salvarProduto()" class="space-y-6">
      <!-- Nome do Produto -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Nome do Produto *</label>
        <input
          [(ngModel)]="formulario.nome"
          name="nome"
          type="text"
          placeholder="Ex: Pastel de Queijo"
          required
          class="w-full px-4 py-3 border-2 border-green-200 rounded-lg focus:border-green-600 focus:outline-none transition-colors" />
      </div>

      <!-- Valores -->
      <div class="grid grid-cols-2 gap-6">
        <!-- Valor de Compra -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Valor de Compra (R$) *</label>
          <input
            [(ngModel)]="formulario.valorCompra"
            name="valorCompra"
            type="number"
            step="0.01"
            placeholder="0.00"
            required
            class="w-full px-4 py-3 border-2 border-green-200 rounded-lg focus:border-green-600 focus:outline-none transition-colors" />
        </div>

        <!-- Valor de Venda -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Valor de Venda (R$) *</label>
          <input
            [(ngModel)]="formulario.valorVenda"
            name="valorVenda"
            type="number"
            step="0.01"
            placeholder="0.00"
            required
            class="w-full px-4 py-3 border-2 border-green-200 rounded-lg focus:border-green-600 focus:outline-none transition-colors" />
        </div>
      </div>

      <!-- Quantidade -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Quantidade em Estoque *</label>
        <input
          [(ngModel)]="formulario.quantidade"
          name="quantidade"
          type="number"
          placeholder="0"
          required
          class="w-full px-4 py-3 border-2 border-green-200 rounded-lg focus:border-green-600 focus:outline-none transition-colors" />
      </div>

      <!-- Descrição -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Descrição (Opcional)</label>
        <textarea
          [(ngModel)]="formulario.descricao"
          name="descricao"
          placeholder="Adicione uma descrição do produto..."
          rows="4"
          class="w-full px-4 py-3 border-2 border-green-200 rounded-lg focus:border-green-600 focus:outline-none transition-colors resize-none"></textarea>
      </div>

      <!-- Upload de Imagem -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Imagem do Produto (Opcional)</label>
        <div class="border-2 border-dashed border-green-300 rounded-lg p-6 text-center cursor-pointer hover:border-green-600 transition-colors">
          <input
            #imagemInput
            type="file"
            accept="image/*"
            (change)="onImagemSelecionada($event)"
            class="hidden" />
          <div (click)="imagemInput.click()">
            <p class="text-gray-600">Clique para selecionar uma imagem</p>
            <p class="text-sm text-gray-500 mt-1">ou arraste e solte aqui</p>
          </div>
          <div *ngIf="formulario.imagem" class="mt-4">
            <img [src]="formulario.imagem" alt="Preview" class="max-h-48 mx-auto rounded-lg" />
          </div>
        </div>
      </div>

      <!-- Botões -->
      <div class="flex gap-4 pt-6">
        <button
          type="submit"
          class="flex-1 px-6 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-all duration-200 ease-in-out active:translate-y-1">
          Salvar Produto
        </button>
        <button
          type="button"
          (click)="cancelar()"
          class="flex-1 px-6 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition-all duration-200 ease-in-out">
          Cancelar
        </button>
      </div>

      <!-- Mensagem de Sucesso -->
      <div *ngIf="mensagemSucesso" class="p-4 bg-green-100 border-l-4 border-green-600 text-green-700 rounded">
        {{ mensagemSucesso }}
      </div>

      <!-- Mensagem de Erro -->
      <div *ngIf="mensagemErro" class="p-4 bg-red-100 border-l-4 border-red-600 text-red-700 rounded">
        {{ mensagemErro }}
      </div>
    </form>
  </div>
</div>
